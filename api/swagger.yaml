---
swagger: "2.0"
info:
  description: "Easily and directly scan and block phishing security threats in input."
  version: "v1"
  title: "phishingapi"
security:
- Apikey: []
paths:
  /phishing/detect/file:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform AI phishing detection and classification on an input image\
        \ or document (PDF or DOCX).  Analyzes input content as well as embedded URLs\
        \ with AI deep learnign to detect phishing and other unsafe content.  Uses\
        \ 100-125 API calls depending on model selected."
      consumes:
      - "multipart/form-data"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - name: "model"
        in: "header"
        description: "Model to use; default setting is Advanced"
        required: false
        type: "string"
        default: "Advanced"
        x-exportParamName: "Model"
        x-optionalDataType: "String"
      - name: "inputFile"
        in: "formData"
        required: false
        type: "file"
        x-exportParamName: "InputFile"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionResponse"
  /phishing/detect/text-string:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform AI phishing detection against input text string.  Returns\
        \ a clean/not-clean result with confidence level and optional rationale."
      consumes:
      - "application/json"
      - "text/json"
      - "application/*+json"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Phishing detection request"
        required: false
        schema:
          $ref: "#/definitions/PhishingDetectionTextStringRequest"
        x-exportParamName: "Body"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionTextStringResponse"
  /phishing/detect/text-string/advanced:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform advanced AI phishing detection and classification against\
        \ input text string.  Analyzes input content as well as embedded URLs with\
        \ AI deep learnign to detect spam, phishing and other unsafe content.  Uses\
        \ 25-100 API calls depending on model selected."
      consumes:
      - "application/json"
      - "text/json"
      - "application/*+json"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Phishing detection request"
        required: false
        schema:
          $ref: "#/definitions/PhishingDetectionAdvancedRequest"
        x-exportParamName: "Body"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionAdvancedResponse"
  /phishing/detect/file/advanced:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform advanced AI phishing detection and classification against\
        \ input text string.  Analyzes input content as well as embedded URLs with\
        \ AI deep learning to detect phishing, phishing and other unsafe content.\
        \  Uses 25-100 API calls depending on model selected."
      consumes:
      - "multipart/form-data"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - name: "model"
        in: "header"
        required: false
        type: "string"
        default: "Advanced"
        x-exportParamName: "Model"
        x-optionalDataType: "String"
      - name: "customPolicyId"
        in: "header"
        required: false
        type: "string"
        x-exportParamName: "CustomPolicyId"
        x-optionalDataType: "String"
      - name: "inputFile"
        in: "formData"
        required: false
        type: "file"
        x-exportParamName: "InputFile"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionAdvancedResponse"
  /phishing/detect/email/advanced:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform advanced AI phishing detection and classification against\
        \ input email.  Analyzes input email as well as embedded URLs with AI deep\
        \ learning to detect phishing, phishing and other unsafe content.  Uses 25-100\
        \ API calls depending on model selected."
      consumes:
      - "application/json"
      - "text/json"
      - "application/*+json"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Phishing detection request"
        required: false
        schema:
          $ref: "#/definitions/AdvancedEmailDetectionRequest"
        x-exportParamName: "Body"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionEmailAdvancedResponse"
  /phishing/detect/url/advanced:
    post:
      tags:
      - "PhishingDetection"
      summary: "Perform advanced AI phishing detection and classification against\
        \ an input URL.  Retrieves the URL content, checks for SSRF threats, and analyzes\
        \ the page with AI deep learning to detect phishing and other unsafe content.\
        \  Uses 100-125 API calls."
      consumes:
      - "application/json"
      - "text/json"
      - "application/*+json"
      produces:
      - "text/plain"
      - "application/json"
      - "text/json"
      parameters:
      - in: "body"
        name: "body"
        description: "URL phishing detection request"
        required: false
        schema:
          $ref: "#/definitions/AdvancedUrlDetectionRequest"
        x-exportParamName: "Body"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/PhishingDetectionUrlAdvancedResponse"
securityDefinitions:
  Apikey:
    description: "Apikey"
    type: "apiKey"
    name: "Apikey"
    in: "header"
definitions:
  AdvancedEmailDetectionRequest:
    type: "object"
    properties:
      FromEmailAddress:
        type: "string"
        description: "Email address of the sender"
      ToEmailAddress:
        type: "string"
        description: "Email address of the recipient"
      Subject:
        type: "string"
        description: "Subject of the email"
      HtmlBody:
        type: "string"
        description: "Body of the email in HTML, or text"
      AllowLowReputationSenders:
        type: "boolean"
        description: "Allow email from low reputation senders and domains"
      AllowSanctioned:
        type: "boolean"
        description: "True to allow sanctioned countries and certain known sanctioned\
          \ entities, false otherwise (default)"
      CustomPolicyID:
        type: "string"
        description: "Apply a Custom Policy for Phishing Enforcement by providing\
          \ the ID; to create a Custom Policy,\r\nnavigate to the Cloudmersive Management\
          \ Portal and select Custom Policies.\r\nRequires Managed Instance or Private\
          \ Cloud"
      InputEmailFile:
        type: "string"
        format: "byte"
        description: "Optional: Input email file bytes (EML, PDF, etc.).  If not provided,\
          \ HtmlBody will be used instead."
        pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
    description: "Request to detect phishing from an email"
    example:
      FromEmailAddress: "FromEmailAddress"
      InputEmailFile: "InputEmailFile"
      HtmlBody: "HtmlBody"
      CustomPolicyID: "CustomPolicyID"
      AllowSanctioned: true
      Subject: "Subject"
      AllowLowReputationSenders: true
      ToEmailAddress: "ToEmailAddress"
  AdvancedUrlDetectionRequest:
    type: "object"
    properties:
      Url:
        type: "string"
        description: "URL to check for phishing"
      CustomPolicyID:
        type: "string"
        description: "Apply a Custom Policy for Phishing Enforcement by providing\
          \ the ID; to create a Custom Policy,\r\nnavigate to the Cloudmersive Management\
          \ Portal and select Custom Policies.\r\nRequires Managed Instance or Private\
          \ Cloud"
    description: "Request to detect phishing from a URL"
    example:
      CustomPolicyID: "CustomPolicyID"
      Url: "Url"
  PhishingDetectionAdvancedRequest:
    type: "object"
    properties:
      InputString:
        type: "string"
        example: "Hello, world!"
        description: "Input text string to detect phishing against"
      TextType:
        type: "string"
        example: "TextMessage"
        description: "Optional: Type of text being analyzed. Must be one of: \"TextMessage\"\
          , \"UserMessage\", \"SalesLead\", \"EmailMessage\", \"SupportCase\", \"\
          AppMessage\", \"Other\"."
      Model:
        type: "string"
        example: "Advanced"
        description: "Optional: Specify which AI model to use.  Possible choices are\
          \ Normal and Advanced.  Default is Advanced."
      AllowUnsolicitedSales:
        type: "boolean"
        example: true
        description: "Optional: True if unsolicited sales should be allowed, false\
          \ otherwise. Defaults to true."
      AllowPromotionalContent:
        type: "boolean"
        example: true
        description: "Optional: True if promotional content should be allowed, false\
          \ otherwise. Defaults to true."
      AllowWebUrls:
        type: "boolean"
        example: true
        description: "Optional: True if web URLs should be allowed in the input text,\
          \ false otherwise. Defaults to true. When false, input containing URLs (including\
          \ homoglyph URLs and spaced-out URLs) will be flagged as not clean."
      AllowPhoneNumbers:
        type: "boolean"
        example: true
        description: "Optional: True if phone numbers should be allowed in the input\
          \ text, false otherwise. Defaults to true. When false, input containing\
          \ phone numbers (including homoglyph digits and spaced-out or spelled-out\
          \ workarounds) will be flagged as not clean."
      AllowEmailAddresses:
        type: "boolean"
        example: true
        description: "Optional: True if email addresses should be allowed in the input\
          \ text, false otherwise. Defaults to true. When false, input containing\
          \ email addresses (including homoglyph characters and obfuscated workarounds\
          \ like \"danny at somedomaine [DOT] com\") will be flagged as not clean."
      ProvideUrlAnalysis:
        type: "boolean"
        example: true
        description: "Optional: True to perform deep URL analysis on any URLs detected\
          \ in the text. When enabled, if the initial AI scan detects URLs, a second\
          \ AI call enumerates them and each URL is individually analyzed for phishing.\
          \ Defaults to true."
      CustomPolicyID:
        type: "string"
        example: ""
        description: "Apply a Custom Policy for Phishing Enforcement by providing\
          \ the ID; to create a Custom Policy,\r\nnavigate to the Cloudmersive Management\
          \ Portal and select Custom Policies.\r\nRequires Managed Instance or Private\
          \ Cloud"
      ProvideAnalysisRationale:
        type: "boolean"
        example: true
        description: "Optional: Set to true to include an analysis rationale in the\
          \ response explaining why the content was or was not flagged.  Default is\
          \ true."
      FromName:
        type: "string"
        example: "John Smith"
        description: "Optional: Name of the sender"
      ToName:
        type: "string"
        example: "Jane Doe"
        description: "Optional: Name of the recipient"
      FromPhoneNumber:
        type: "string"
        example: "+1-555-123-4567"
        description: "Optional: Phone number of the sender"
      ToPhoneNumber:
        type: "string"
        example: "+1-555-987-6543"
        description: "Optional: Phone number of the recipient"
      FromEmailAddress:
        type: "string"
        example: "john.smith@cloudmersive.com"
        description: "Optional: Email address of the sender"
      ToEmailAddress:
        type: "string"
        example: "jane.doe@cloudmersive.com"
        description: "Optional: Email address of the recipient"
    description: "AI advanced phishing detection request"
    example:
      AllowWebUrls: true
      FromEmailAddress: "john.smith@cloudmersive.com"
      AllowPhoneNumbers: true
      FromPhoneNumber: "+1-555-123-4567"
      AllowUnsolicitedSales: true
      ProvideUrlAnalysis: true
      TextType: "TextMessage"
      ToPhoneNumber: "+1-555-987-6543"
      FromName: "John Smith"
      CustomPolicyID: ""
      InputString: "Hello, world!"
      Model: "Advanced"
      ProvideAnalysisRationale: true
      AllowEmailAddresses: true
      ToName: "Jane Doe"
      AllowPromotionalContent: true
      ToEmailAddress: "jane.doe@cloudmersive.com"
  PhishingDetectionAdvancedResponse:
    type: "object"
    properties:
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
      ContainsPhishing:
        type: "boolean"
        description: "True if the input text contains a phishing attempt, false otherwise"
      ContainsUnsolicitedSales:
        type: "boolean"
        description: "True if the input text contains unsolicited sales, false otherwise"
      ContainsPromotionalContent:
        type: "boolean"
        description: "True if the input text contains promotional content, false otherwise"
      ContainsWebUrls:
        type: "boolean"
        description: "True if the input text contains web URLs, including homoglyph\
          \ URLs and spaced-out URL workarounds"
      ContainsPhoneNumbers:
        type: "boolean"
        description: "True if the input text contains phone numbers, including homoglyph\
          \ digits and spaced-out or spelled-out workarounds"
      ContainsEmailAddresses:
        type: "boolean"
        description: "True if the input text contains email addresses, including homoglyph\
          \ characters and obfuscated workarounds"
      ConfidenceLevel:
        type: "number"
        format: "double"
        description: "Confidence level between 0.0 and 1.0 where values over 0.9 indicate\
          \ high confidence"
      AnalysisRationale:
        type: "string"
        description: "Rationale for why the conclusion was formed"
      UnsafeUrls:
        type: "array"
        description: "URLs detected in the input text that were analyzed and found\
          \ to be unsafe. Only populated when ProvideUrlAnalysis is true and URLs\
          \ are detected."
        items:
          $ref: "#/definitions/UnsafeUrlResult"
    description: "Result of detecting phishing using AI"
    example:
      ConfidenceLevel: 0.8008281904610115
      ContainsUnsolicitedSales: true
      ContainsWebUrls: true
      ContainsPhishing: true
      ContainsPhoneNumbers: true
      ContainsEmailAddresses: true
      UnsafeUrls:
      - IsSsrfThreat: true
        ContainsPhishingAttempt: true
        ContainsPhishing: true
        Url: "Url"
        CleanResult: true
      - IsSsrfThreat: true
        ContainsPhishingAttempt: true
        ContainsPhishing: true
        Url: "Url"
        CleanResult: true
      AnalysisRationale: "AnalysisRationale"
      CleanResult: true
      ContainsPromotionalContent: true
  PhishingDetectionEmailAdvancedResponse:
    type: "object"
    properties:
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
      PhishingRiskLevel:
        type: "number"
        format: "double"
        description: "Overall phishing risk level between 0.0 and 1.0"
      SpamRiskLevel:
        type: "number"
        format: "double"
        description: "Overall phishing spam level between 0.0 and 1.0"
      ContainsLowReputationSender:
        type: "boolean"
        description: "True if the input email is from a low reputation sender"
      ContainsPhishing:
        type: "boolean"
        description: "True if the input email contains phishing threat risks, false\
          \ otherwise"
      ContainsSpam:
        type: "boolean"
        description: "True if the email contains phishing threat risks, false otherwise"
      ContainsUnsolicitedSales:
        type: "boolean"
        description: "True if the input email contains unsolicited sales, false otherwise"
      ContainsPromotionalContent:
        type: "boolean"
        description: "True if the input email contains promotional content, false\
          \ otherwise"
      ContainsPhishingAttempt:
        type: "boolean"
        description: "True if the input email contains a phishing attempt, false otherwise"
      AnalysisRationale:
        type: "string"
        description: "Rationale for why the conclusion was formed"
    description: "Result of detecting phishing using AI"
    example:
      PhishingRiskLevel: 0.8008281904610115
      ContainsSpam: true
      ContainsUnsolicitedSales: true
      ContainsPhishingAttempt: true
      SpamRiskLevel: 6.027456183070403
      ContainsPhishing: true
      ContainsLowReputationSender: true
      AnalysisRationale: "AnalysisRationale"
      CleanResult: true
      ContainsPromotionalContent: true
  PhishingDetectionResponse:
    type: "object"
    properties:
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
    description: "Result of detecting phishing using AI"
    example:
      CleanResult: true
  PhishingDetectionTextStringRequest:
    type: "object"
    properties:
      InputString:
        type: "string"
        example: "Hello, world!"
        description: "Input text string to detect phishing against"
      Model:
        type: "string"
        example: "Advanced"
        description: "Optional: Specify which AI model to use.  Possible choices are\
          \ Normal and Advanced.  Default is Advanced."
      ProvideAnalysisRationale:
        type: "boolean"
        example: true
        description: "Optional: Set to true to include an analysis rationale in the\
          \ response explaining why the content was or was not flagged.  Default is\
          \ true."
    description: "AI phishing detection request for basic text string analysis"
    example:
      InputString: "Hello, world!"
      Model: "Advanced"
      ProvideAnalysisRationale: true
  PhishingDetectionTextStringResponse:
    type: "object"
    properties:
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
      ConfidenceLevel:
        type: "number"
        format: "double"
        description: "Confidence level between 0.0 and 1.0 where values over 0.9 indicate\
          \ high confidence"
      AnalysisRationale:
        type: "string"
        description: "Rationale for why the conclusion was formed"
    description: "Result of detecting phishing using AI for basic text string analysis"
    example:
      ConfidenceLevel: 0.8008281904610115
      AnalysisRationale: "AnalysisRationale"
      CleanResult: true
  PhishingDetectionUrlAdvancedResponse:
    type: "object"
    properties:
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
      PhishingRiskLevel:
        type: "number"
        format: "double"
        description: "Overall phishing risk level between 0.0 and 1.0"
      IsSsrfThreat:
        type: "boolean"
        description: "True if the URL is an SSRF threat"
      ContainsPhishing:
        type: "boolean"
        description: "True if the URL contains phishing threat risks, false otherwise"
      ContainsUnsolicitedSales:
        type: "boolean"
        description: "True if the URL contains unsolicited sales, false otherwise"
      ContainsPromotionalContent:
        type: "boolean"
        description: "True if the URL contains promotional content, false otherwise"
      ContainsPhishingAttempt:
        type: "boolean"
        description: "True if the URL contains a phishing attempt, false otherwise"
      AnalysisRationale:
        type: "string"
        description: "Rationale for why the conclusion was formed"
    description: "Result of detecting phishing from a URL using AI"
    example:
      PhishingRiskLevel: 0.8008281904610115
      IsSsrfThreat: true
      ContainsUnsolicitedSales: true
      ContainsPhishingAttempt: true
      ContainsPhishing: true
      AnalysisRationale: "AnalysisRationale"
      CleanResult: true
      ContainsPromotionalContent: true
  UnsafeUrlResult:
    type: "object"
    properties:
      Url:
        type: "string"
        description: "The URL that was detected and analyzed"
      CleanResult:
        type: "boolean"
        description: "True if the result is not phishing (clean), and false otherwise"
      IsSsrfThreat:
        type: "boolean"
        description: "True if the URL is an SSRF threat"
      ContainsPhishing:
        type: "boolean"
        description: "True if the URL contains phishing threat risks, false otherwise"
      ContainsPhishingAttempt:
        type: "boolean"
        description: "True if the URL contains a phishing attempt, false otherwise"
    description: "Result of analyzing an individual URL found in text"
    example:
      IsSsrfThreat: true
      ContainsPhishingAttempt: true
      ContainsPhishing: true
      Url: "Url"
      CleanResult: true
